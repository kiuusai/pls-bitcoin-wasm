name: Publish

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Build and test in Devcontainers
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -e
            npm run build:ts

            nigiri start

            cd ts

            npm test -- --run

            cd -

      - name: Show package contents
        run: |
          cd ts
          npm pack --dry-run

      - name: Publish to npm
        run: |
          cd ts
          npm publish
