name: Publish

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Cache files
        uses: actions/cache@v6
        with:
          path: |
            .cargo-ci
            **/node_modules/**
          key: pls-bitcoin-wasm-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/node_modules/**') }}
          restore-keys: |
            pls-bitcoin-wasm-

      - name: Docker registry login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test in Devcontainers
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: always
          runCmd: |
            set -e

            export CARGO_HOME="${PWD}/.cargo-ci"
            mkdir -p "${CARGO_HOME}"

            npm install
            npm run build:ts

            nigiri start

            (
              cd ts

              npm install
              npm test -- --run
            )

      - name: Show package contents
        working-directory: ts
        run: |
          npm pack --dry-run

      - name: Publish to npm
        working-directory: ts
        run: |
          npm publish

      - name: Delete old cache files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list \
            --key pls-bitcoin-wasm-
          --limit 100
          --json id,key
          --jq '.[1:] | .[].id' |
          xargs -r -n1 gh cache delete --confirm
